            const orgao = params.get('orgao') || localStorage.getItem('sginf_lead_orgao') || 'o seu órgão';
            
            document.getElementById('resultado-form').innerHTML = `
                ✅ Obrigado, <strong>${nome}</strong>! Seus dados de demonstração para <strong>${orgao} ${municipio ? 'de ' + municipio : ''}</strong> foram recebidos com sucesso. Entraremos em contato em breve!
